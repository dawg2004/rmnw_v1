<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>準備中 | RMNW 再生医療ネットワーク</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500&family=Noto+Serif+JP:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Noto Sans JP',sans-serif;background:#f5f8fb;min-height:100vh;display:flex;flex-direction:column}
    .header{background:#fff;border-bottom:2px solid #1D4E7A;padding:16px 40px;display:flex;align-items:center}
    .logo-area{display:flex;align-items:baseline;gap:12px;text-decoration:none}
    .logo-abbr{font-family:'Noto Serif JP',serif;font-size:26px;font-weight:500;color:#1D4E7A;letter-spacing:0.1em}
    .logo-divider{width:1px;height:20px;background:#d0e4f0;margin:0 4px}
    .logo-text{font-size:12px;color:#6a8a9a;font-weight:300;line-height:1.5}
    .main{flex:1;display:flex;align-items:center;justify-content:center;padding:40px 20px}
    .card{background:#fff;border-radius:12px;border:1px solid #d0e4f0;padding:60px 48px;text-align:center;max-width:480px;width:100%}
    .icon{font-size:56px;margin-bottom:24px}
    .title{font-family:'Noto Serif JP',serif;font-size:24px;font-weight:500;color:#1D4E7A;margin-bottom:12px}
    .desc{font-size:14px;color:#6a8a9a;font-weight:300;line-height:1.8;margin-bottom:32px}
    .back-btn{display:inline-block;background:#1D4E7A;color:#fff;padding:12px 32px;border-radius:4px;font-size:14px;font-weight:400;text-decoration:none;letter-spacing:0.05em}
    .back-btn:hover{background:#2A6FA8}
    @media(max-width:600px){
      .header{padding:12px 16px}
      .logo-abbr{font-size:20px}
      .card{padding:48px 24px}
      .title{font-size:20px}
    }
  </style>
</head>
<body>
  <div class="header">
    <a href="index.html" class="logo-area">
      <span class="logo-abbr">RMNW</span>
      <div class="logo-divider"></div>
      <div class="logo-text">再生医療ネットワーク<br>Regenerative Medicine Network</div>
    </a>
  </div>
  <div class="main">
    <div class="card">
      <div class="icon">🛠️</div>
      <h1 class="title">準備中</h1>
      <p class="desc">このページは現在準備中です。<br>公開まで今しばらくお待ちください。</p>
      <a href="index.html" class="back-btn">トップページへ戻る</a>
    </div>
  </div>
</body>
</html>
